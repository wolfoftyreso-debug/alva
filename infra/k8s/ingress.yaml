# Ingress med TLS (cert-manager). Längsta prefix vinner:
# /api/ai → AI-orkestern, övriga /api + /halsa → plattformen, / → webben.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guidad-felsokning
  namespace: guidad-felsokning
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # ersätt med er issuer
    # Teknikern dokumenterar med foto och video som följer med
    # händelseloggen. Standardgränsen (1 MB) skulle avvisa
    # dokumentationen vid dörren medan tjänsten själv tar 4 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120" # AI-svar kan ta tid
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.exempel.se] # ersätt med er domän
      secretName: guidad-felsokning-tls
  rules:
    - host: app.exempel.se # ersätt med er domän
      http:
        paths:
          - path: /api/ai
            pathType: Prefix
            backend:
              service: { name: ai-orkester, port: { number: 80 } }
          - path: /api
            pathType: Prefix
            backend:
              service: { name: plattform, port: { number: 80 } }
          - path: /halsa
            pathType: Prefix
            backend:
              service: { name: plattform, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
