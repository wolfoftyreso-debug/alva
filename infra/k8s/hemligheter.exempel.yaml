# EXEMPEL — checka aldrig in riktiga värden. Skapa hellre direkt:
#
#   kubectl -n guidad-felsokning create secret generic felsokning-hemligheter \
#     --from-literal=anthropic-api-key='sk-ant-…' \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=postgres-losenord="$(openssl rand -base64 24)" \
#     --from-literal=integration-nyckel="$(openssl rand -hex 32)"
#
# I produktion: använd extern secrets-hantering (External Secrets Operator,
# Sealed Secrets eller molnleverantörens secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: felsokning-hemligheter
  namespace: guidad-felsokning
type: Opaque
stringData:
  anthropic-api-key: ERSATT-MIG
  jwt-secret: ERSATT-MIG
  postgres-losenord: ERSATT-MIG
  # 32 byte hex (openssl rand -hex 32) — krypterar kundernas
  # märkesspecifika credentials i vila. Byts nyckeln måste kopplingarna
  # sparas om; tjänsten visar då inga värden i stället för att gissa.
  integration-nyckel: ERSATT-MIG
