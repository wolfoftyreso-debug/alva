# Bygger och publicerar de tre bilderna till GHCR, taggade med git-SHA:t.
# Driftsättningen sker i ett eget flöde (driftsatt.yml) som kör
# terraform apply mot en miljö med godkännandekrav — en bild som ligger i
# registret är alltså inte samma sak som en bild som kör.
name: Publicera

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTER: ghcr.io/${{ github.repository_owner }}

jobs:
  publicera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Klientens API-adress bakas in vid bygget (Vite), så bilden är
      # miljöbunden — en bild byggd mot en domän pekar på fel API i en
      # annan miljö.
      - name: Bygg och publicera web
        run: |
          docker build -t "$REGISTER/guidad-felsokning-web:${{ github.sha }}" \
            --build-arg VITE_PLATTFORM_URL="${{ vars.PLATTFORM_URL }}" \
            --build-arg VITE_AI_ORKESTER_URL="${{ vars.PLATTFORM_URL }}" .
          docker push "$REGISTER/guidad-felsokning-web:${{ github.sha }}"

      - name: Bygg och publicera ai-orkester
        run: |
          docker build -t "$REGISTER/guidad-felsokning-ai-orkester:${{ github.sha }}" services/ai-orkester
          docker push "$REGISTER/guidad-felsokning-ai-orkester:${{ github.sha }}"

      - name: Bygg och publicera plattform
        run: |
          docker build -t "$REGISTER/guidad-felsokning-plattform:${{ github.sha }}" services/plattform
          docker push "$REGISTER/guidad-felsokning-plattform:${{ github.sha }}"

      - name: Sammanfatta
        run: |
          {
            echo "### Publicerat"
            echo ""
            echo '```'
            echo "bildtagg: ${{ github.sha }}"
            echo '```'
            echo ""
            echo "Driftsätt med flödet **Driftsätt** och den taggen."
          } >> "$GITHUB_STEP_SUMMARY"
